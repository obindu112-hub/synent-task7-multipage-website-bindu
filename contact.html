<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | LearnPath</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <h2 class="logo">LearnPath<span>.</span></h2>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-heading">
            <h1>Contact Us</h1>
            <p>
                Have a question or suggestion? Send us a message.
                We'd love to hear from you!
            </p>
        </section>

        <section class="content-section">
            <h2>Get in Touch</h2>
            <p>Fill out the form below to send your message.</p>

            <form class="contact-form" id="contact-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject" required>
                        <option value="">Select a subject</option>
                        <option value="coding">Programming Skills</option>
                        <option value="placement">Placement Preparation</option>
                        <option value="career">Career Guidance</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="btn primary-btn">
                    Send Message
                </button>

                <p id="form-message" role="status"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 LearnPath. Created for student learning and career growth.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
